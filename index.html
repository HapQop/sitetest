<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheatBlox — Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            color: #fff;
        }

        .navbar {
            display: flex;
            gap: 8px;
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 50px;
            border: 1px solid #2a2a2a;
        }

        .navbar a {
            color: #a0a0a0;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .navbar a:hover {
            color: #ffffff;
            background: #2a2a2a;
        }

        /* Активная кнопка (пример) */
        .navbar a.active {
            color: #ffffff;
            background: #2a2a2a;
        }
        .navbar .brand {
            padding: 0 8px;
            color: #fff;
            background: none;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.6px;
        }
        .navbar .brand span { color: #ff9d5c; }
        .home-hero {
            display: grid;
            min-height: calc(100vh - 118px);
            padding: 40px 20px 100px;
            place-content: center;
            text-align: center;
        }
        .home-hero h1 {
            color: #fff;
            font-size: clamp(48px, 9vw, 94px);
            font-weight: 850;
            letter-spacing: -4px;
            line-height: .95;
        }
        .home-hero h1 span { color: #ff9d5c; }
        .home-hero p {
            margin-top: 18px;
            color: #b7b7b7;
            font-size: clamp(17px, 2vw, 22px);
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" href="styles/site-header.css">
    <script src="scripts/site-header.js" defer></script>
      <link rel="stylesheet" href="styles/site-footer.css">
      <script src="scripts/site-footer.js" defer></script><script src="scripts/site-i18n.js" defer></script><script src="scripts/site-currency.js" defer></script>
    <script src="lib/three.min.js" defer></script>
    <script src="scripts/lava-bubbles.js" defer></script>
</head>
<body data-page="nav-home">

    <nav class="site-header" aria-label="Primary navigation">
        <a class="site-brand" href="index.html"><span class="brand-mark">◢</span>Cheat<span>Blox</span></a>
        <div class="site-nav">
            <a class="active" href="index.html" aria-current="page" data-i18n="nav-home">Home</a><a href="pages/products.html" data-i18n="nav-products">Products</a><a href="pages/exploits.html" data-i18n="nav-exploits">Exploits</a><a href="pages/reviews.html" data-i18n="nav-reviews">Reviews</a><a href="pages/contact.html" data-i18n="nav-contact">Contact</a>
        </div>
        <div class="site-controls">
            <div class="language-toggle" role="radiogroup" aria-label="Language"><input id="language-ru" type="radio" name="language" value="ru" checked><label for="language-ru">RU</label><input id="language-en" type="radio" name="language" value="en"><label for="language-en">EN</label><span class="language-slider" aria-hidden="true"></span></div>
            <a class="login-link" href="pages/auth.html?mode=login" data-i18n="login">Login</a><a class="register-link" href="pages/auth.html?mode=register" data-i18n="register">Register</a>
        </div>
    </nav>

    <main class="home-hero">
        <h1>Cheat<span>Blox</span></h1>
        <p data-i18n="home-tagline">Открой Максимум возможностей</p>
    </main>

</body>
</html>
