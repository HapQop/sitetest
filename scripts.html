    <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheatBlox — Scripts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            gap: 8px;
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 50px;
            border: 1px solid #2a2a2a;
            width: fit-content;
            margin: 40px auto 0;
        }
        .navbar a {
            color: #a0a0a0;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .navbar a:hover { color: #fff; background: #2a2a2a; }
        .navbar a.active { color: #fff; background: #2a2a2a; }
        .navbar .brand { padding: 0 8px; color: #fff; background: none; font-size: 20px; font-weight: 800; letter-spacing: -.6px; }
        .navbar .brand span { color: #ff9d5c; }
        main { width:min(900px,calc(100% - 40px)); margin:50px auto 72px; }
        .scripts-heading h1 { color:#fff; font-size:31px; font-weight:800; letter-spacing:-.8px; }
        .scripts-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:18px; }
        .scripts-toolbar__left { display:flex; align-items:center; gap:10px; }
        .favorite-filter { display:inline-flex; align-items:center; gap:8px; min-height:38px; padding:0 13px; border:1px solid #49413b; border-radius:9px; color:#d6cec8; background:#1d1b1a; font:800 12px/1 Inter,ui-sans-serif,system-ui,sans-serif; cursor:pointer; transition:color .18s ease,border-color .18s ease,background .18s ease,transform .18s ease; }
        .favorite-filter:hover,.favorite-filter:focus-visible { border-color:#ff9d5c; color:#ffb077; background:#2a211d; transform:translateY(-1px); }
        .favorite-filter.is-active { border-color:#ff9d5c; color:#21140c; background:#ff9d5c; }
        .favorite-filter svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.9; }
        .favorite-filter.is-active svg { fill:currentColor; }
        .scripts-search { width:min(280px,42vw); min-height:38px; padding:0 12px; border:1px solid #383331; border-radius:9px; color:#eee9e6; background:#171717; font:600 13px/1 Inter,ui-sans-serif,system-ui,sans-serif; }
        .scripts-search::placeholder { color:#77716e; }
        .scripts-search:focus-visible,.favorite-filter:focus-visible { outline:2px solid rgba(255,157,92,.35); outline-offset:3px; }
        .script-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; margin-top:26px; }
        .script-card-shell { position:relative; min-width:0; }
        .script-card { overflow:hidden; border:1px solid #35302d; border-radius:15px; background:#151515; box-shadow:0 18px 34px rgba(0,0,0,.25); transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease; }
        .script-card:hover { border-color:rgba(255,157,92,.72); transform:translateY(-3px); box-shadow:0 22px 42px rgba(0,0,0,.34); }
        .script-card-link { display:block; color:inherit; text-decoration:none; }
        .script-card-link:focus-visible { outline:2px solid #fff; outline-offset:5px; border-radius:17px; }
        .script-card__media { position:relative; aspect-ratio:16/9; overflow:hidden; background:#080808; }
        .script-card__media img { display:block; width:100%; height:100%; object-fit:cover; }
        .script-card__bottom { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-top:14px; }
        .script-card__badge { display:inline-flex; align-items:center; flex:0 0 auto; min-height:28px; padding:0 9px; border:1px solid #ff9d5c; border-radius:7px; color:#ffb077; background:rgba(18,18,18,.9); font:850 10px/1 Inter,ui-sans-serif,system-ui,sans-serif; letter-spacing:.3px; }
        .script-card__body { padding:16px; }
        .script-card__top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .script-card h2 { color:#fff; font-size:19px; letter-spacing:-.3px; }
        .script-card__game { padding:5px 8px; border-radius:6px; color:#c6c0bc; background:#262626; font-size:10px; font-weight:800; }
        .script-card__description { margin-top:8px; color:#999390; font-size:13px; line-height:1.5; }
        .script-card__platforms { display:flex; flex-wrap:wrap; gap:7px; }
        .platform-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 8px; border:1px solid transparent; border-radius:7px; font-size:11px; font-weight:800; }
        .platform-badge svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.8; }
        .platform-badge--pc { border-color:rgba(104,169,255,.35); color:#8fc0ff; background:rgba(104,169,255,.12); }
        .platform-badge--phone { border-color:rgba(72,211,145,.35); color:#72dda8; background:rgba(72,211,145,.12); }
        .scripts-empty { grid-column:1/-1; padding:28px 18px; border:1px solid #302d2b; border-radius:12px; color:#9f9996; background:#151515; font-size:14px; text-align:center; }
        @media (max-width:700px) { main { width:calc(100% - 28px); margin-top:34px; } .script-grid { grid-template-columns:1fr; } .scripts-toolbar { align-items:stretch; flex-direction:column; gap:10px; } .scripts-toolbar__left { width:100%; } .favorite-filter { flex:1; justify-content:center; } .scripts-search { width:100%; } }
    </style>
