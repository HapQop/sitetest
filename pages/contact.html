<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheatBlox — Contact</title>
  <style>
    :root { --page:#090909; --panel:#171717; --border:#303030; --discord:#5865f2; --telegram:#2aabee; }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; color:#f7f7f7; background:var(--page); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .navbar { display:flex; align-items:center; justify-content:center; gap:8px; width:fit-content; max-width:calc(100% - 32px); margin:40px auto 0; padding:8px 12px; border:1px solid #2a2a2a; border-radius:50px; background:#1a1a1a; }
    .navbar a { padding:10px 18px; border-radius:40px; color:#a0a0a0; font-size:15px; font-weight:600; text-decoration:none; transition:.2s ease; }
    .navbar a:hover,.navbar a.active { color:#fff; background:#2a2a2a; }
    .navbar .brand { padding:0 8px; color:#fff; background:none; font-size:20px; font-weight:800; letter-spacing:-.6px; }
    .navbar .brand span { color:#ff9d5c; }
    main { width:min(860px,calc(100% - 40px)); margin:155px auto 0; }
    .contacts { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .contact-card { position:relative; display:flex; min-height:185px; align-items:center; justify-content:space-between; overflow:hidden; padding:27px; border:1px solid var(--border); border-radius:22px; background:var(--panel); color:#fff; text-decoration:none; transition:transform .2s ease,border-color .2s ease,background .2s ease; }
    .contact-card:hover { transform:translateY(-5px); }
    .contact-card::after { position:absolute; right:-55px; bottom:-72px; width:190px; height:190px; border-radius:50%; content:""; opacity:.17; }
    .discord:hover { border-color:var(--discord); background:#1a1b22; } .discord::after { right:auto; bottom:-185px; left:-80px; width:300px; height:300px; background:var(--discord); }
    .telegram { cursor:default; } .telegram::after { background:var(--telegram); } .telegram:hover { border-color:#237caf; background:#151b1e; }
    .contact-name { position:relative; z-index:1; font-size:25px; font-weight:800; letter-spacing:-.6px; }
    .telegram .contact-name { color:#5ac4fa; }
    .contact-icon { position:relative; z-index:1; display:grid; flex:0 0 58px; width:58px; height:58px; place-items:center; border-radius:17px; }
    .discord .contact-name { color:#9ba4ff; } .discord .contact-icon { background:rgba(88,101,242,.22); color:#9ba4ff; } .telegram .contact-icon { background:rgba(42,171,238,.16); color:#5ac4fa; }
    .contact-icon svg { display:block; width:32px; height:32px; fill:currentColor; }
    .discord-mark { display:block; width:32px; height:32px; }
    @media (max-width:650px) { .navbar { flex-wrap:wrap; justify-content:center; } .navbar a { padding:8px 12px; font-size:14px; } main { margin-top:65px; } .contacts { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="../styles/site-header.css">

</head>
